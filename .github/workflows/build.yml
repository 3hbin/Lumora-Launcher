name: Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with APK'
        required: false
        default: 'false'
        type: boolean
      version_name:
        description: 'Version name for release (e.g. 1.0.1)'
        required: false
        default: ''
      version_code:
        description: 'Version code integer (must increase)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Do NOT use android-actions/setup-android – it requests the removed package "tools"
      # and fails on current runners. Use the SDK already present on the image instead.
      - name: Configure Android SDK
        run: |
          set -euo pipefail

          # Common locations on GitHub-hosted Ubuntu runners
          if [ -d "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -d "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          else
            echo "No Android SDK found on runner"
            exit 1
          fi

          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          # Find sdkmanager (cmdline-tools layout varies by image)
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            ls -la "$SDK_ROOT/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          # Accept licenses (non-interactive)
          mkdir -p "$SDK_ROOT/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c4489b0a0e8ea0\n" > "$SDK_ROOT/licenses/android-sdk-license" || true
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Install only packages that still exist. Never install the obsolete "tools" package.
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            || "$SDKMANAGER" --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Android SDK ready"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumora-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Compute SHA-256
        id: sha
        run: |
          SHA=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name || '1.0.0' }}
          name: Lumora Launcher ${{ inputs.version_name || '1.0.0' }}
          body: |
            ## Lumora Launcher ${{ inputs.version_name || '1.0.0' }}

            **versionCode:** ${{ inputs.version_code || '2' }}

            ### Changelog
            - See commit history for details.

            ### SHA-256
            ```
            ${{ steps.sha.outputs.sha256 }}
            ```

            ### Install
            1. Download the APK below.
            2. Open the APK on your device (enable install from unknown sources if needed).
            3. Confirm the update. Your launcher data is preserved.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
